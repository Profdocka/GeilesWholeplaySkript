# Lädt Code und Vorlagen auf den ZAP-Server.
# Laufzeitdaten (dioramas/, server/*.json) werden nie hochgeladen oder gelöscht –
# dafür gibt es pull-data.yml und push-data.yml.
#
# Auslöser:
#   - Push eines Tags "v*"  → deployt diesen Tag
#   - Manuell (Actions → Deploy to ZAP → Run workflow) → deployt den angegebenen Tag,
#     z.B. "v1.1.0" für einen Rollback. Funktioniert auch für Tags ohne diese Workflow-Datei.
# Danach im txAdmin: restart GeilesWholeplaySkript
#
# Es wird bei jedem Deploy alles hochgeladen und überschrieben (~1,6 MB).
# Im Repo gelöschte Dateien bleiben auf dem Server liegen und müssen dort von Hand entfernt werden.
# lftp statt FTP-Deploy-Action, weil ZAP Datenverbindungen per EPSV abbricht – lftp nutzt PASV.

name: Deploy to ZAP

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag, der deployt werden soll (z.B. v1.1.0)'
        required: true

concurrency:
  group: zap-ftp
  cancel-in-progress: false

env:
  ZAP_DIR: /g619270/fivem/Qbox_9E2E93.base/resources/GeilesWholeplaySkript

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Hochladen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            set net:max-retries 3;
            open --env-password -u \"$FTP_USERNAME\" \"ftp://$FTP_SERVER\";
            mirror --reverse --no-perms --verbose --parallel=4 \
              --exclude '^\.git' \
              --exclude '^README\.md$' \
              --exclude '^CONTRIBUTING\.md$' \
              --exclude '^dioramas/' \
              --exclude '^server/[^/]*\.json$' \
              ./ \"$ZAP_DIR\";
          "
