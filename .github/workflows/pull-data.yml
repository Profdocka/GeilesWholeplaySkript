# Holt die Laufzeitdaten (dioramas/, server/*.json) vom ZAP-Server ins Repo.
# Der Server ist die Source of Truth: geänderte Dateien im Repo werden überschrieben.
# Auf dem Server gelöschte Dateien bleiben im Repo erhalten.
# Danach lokal: git pull

name: Daten holen (ZAP → Repo)

on:
  workflow_dispatch:

concurrency:
  group: zap-ftp
  cancel-in-progress: false

permissions:
  contents: write

env:
  ZAP_DIR: /g619270/fivem/Qbox_9E2E93.base/resources/GeilesWholeplaySkript

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Daten herunterladen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            open --env-password -u \"$FTP_USERNAME\" \"ftp://$FTP_SERVER\";
            mirror --verbose \"$ZAP_DIR/dioramas\" ./dioramas;
            mirror --verbose --no-recursion --include-glob '*.json' --exclude-glob '*' \"$ZAP_DIR/server\" ./server;
          "

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dioramas server/*.json
          if git diff --cached --quiet; then
            echo "Keine neuen Daten auf dem Server."
          else
            git diff --cached --stat
            git commit -m "Data sync from ZAP"
            git push
          fi
