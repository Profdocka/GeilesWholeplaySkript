<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel='stylesheet' type='text/css' media='screen' href='./style.css'>
    <script src='./script.js' defer></script>
</head>


<body>
    <div id="watermark-container" class="watermark">
        <img src="./images/KussKultLogo.png" id="watermark-itself" class="watermark" />
    </div>
    <div id="gw-menu-screen" class="head-menu">
        <div class="options-container">
            <span id="homeTab" class="material-icons md-18 sidebar" style="color: white;">home</span>
            <span id="characterTab" class="material-icons md-18 sidebar" style="color: white;">person</span>
            <span id="vehicleTab" class="material-icons md-18 sidebar" style="color: white;">commute</span>
            <span id="factionTab" class="material-icons md-18 sidebar" style="color: white;">groups</span>
            <span id="locationTab" class="material-icons md-18 sidebar" style="color: white;">explore</span>
            <span id="myVehiclesTab" class="material-icons md-18 sidebar" style="color: white;">car_rental</span>
        </div>
        <div class="content-container">
            <nav class="navbar">
                <div>
                    <input id="search-bar" class="search-bar" placeholder="Search Kuss Kult Universe...">
                    <span class="material-icons" style="color: white;">search</span>
                </div>
                <span id="mycar" class="material-icons md-18 controls" style="color: white;">directions_car</span>
                <span id="exit" class="material-icons md-18 controls" style="color: white;">close</span>
            </nav>
            <main id="content-holder" class="entity-block">
                <!--Data inserted by Javascript-->
            </main>
        </div>
    </div>
</body>

</html>
